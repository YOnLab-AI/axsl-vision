plugins { id 'com.android.library' }
android {
    namespace 'com.yonlab.vision'
    androidResources { noCompress += ['tflite','onnx'] }
    compileSdk 36
    defaultConfig { minSdk 24; targetSdk 36 }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    packaging { jniLibs { useLegacyPackaging = false; keepDebugSymbols += ['**/*.so'] }; resources { excludes += ['META-INF/DEPENDENCIES','META-INF/INDEX.LIST'] } }
    testOptions { unitTests.returnDefaultValues = true }
}
dependencies {
    implementation 'com.google.mlkit:segmentation-selfie:16.0.0-beta6'
    implementation 'com.google.mlkit:barcode-scanning:17.3.0'
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.24.3'
    implementation 'com.google.mlkit:pose-detection:18.0.0-beta5'
    implementation 'com.google.mlkit:pose-detection-accurate:18.0.0-beta5'
    implementation 'com.google.mlkit:text-recognition-korean:16.0.1'
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    implementation 'com.google.zxing:core:3.5.3'
    api 'com.google.mlkit:face-detection:16.1.7'
    api 'org.opencv:opencv:4.13.0'
    api 'com.google.ai.edge.litert:litert:1.4.2'
    implementation 'androidx.core:core:1.16.0'
    implementation 'androidx.exifinterface:exifinterface:1.4.1'
    testImplementation 'junit:junit:4.13.2'
}
