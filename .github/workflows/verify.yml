name: Verify reference app

on:
  workflow_dispatch:
  pull_request:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - name: Install Android SDK platform
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Validate asset tools
        run: python -m unittest discover -s tools/tests -v
      - name: Fetch locked runtime dependency
        run: python tools/fetch_assets.py --group runtime
      - name: Unit tests and Android lint
        run: |
          chmod +x gradlew
          ./gradlew :vision:testDebugUnitTest :offlinevoice:testDebugUnitTest :app:lintDebug --no-daemon --console=plain
      - name: Preserve test and lint reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-and-lint-reports
          path: |
            **/build/test-results/**/*.xml
            **/build/reports/lint-results-*.html
          if-no-files-found: warn
